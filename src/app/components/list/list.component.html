<div class="list-buttons">
    <button mat-stroked-button (click)="setView(true)"><mat-icon aria-hidden="false" aria-label="List icon" fontIcon="list"></mat-icon>
    </button>
    <button mat-stroked-button (click)="setView(false)"><mat-icon aria-hidden="false" aria-label="List icon" fontIcon="grid_view"></mat-icon></button>
</div>

<div *ngIf="loading">
    <mat-spinner></mat-spinner>
</div>

<div *ngIf="!loading" >
    <mat-list *ngIf="viewList" [@fadeIn] class="mat-elevation-z4">
        <mat-list-item *ngFor="let character of listCharacters?.results">
            <mat-card mat-button matRipple [routerLink]="['/character',character.id]">
                <mat-card-header>
                    <img mat-card-avatar [src]="character.image" alt="{{ character.name }}" />
                    <mat-card-title>{{ character.name }}</mat-card-title>
                    <mat-card-subtitle>{{ character.species }}</mat-card-subtitle>
                </mat-card-header>
            </mat-card>
        </mat-list-item>
    </mat-list>

    <mat-grid-list cols="2" rowHeight="2:2" gutterSize="16px" *ngIf="!viewList" [@fadeIn] class="mat-elevation-z4">
        <mat-grid-tile *ngFor="let character of listCharacters?.results" (click)="viewDetail(character.id)">
            <a mat-button [routerLink]="['/character',character.id]">
            <mat-card >
                <mat-card-header>
                    <img mat-card-avatar [src]="character.image" alt="{{ character.name }}" />
                    <mat-card-title>{{ character.name }}</mat-card-title>
                    <mat-card-subtitle>{{ character.species }}</mat-card-subtitle>
                </mat-card-header>
                <img mat-card-image [src]="character.image" alt="{{ character.name }}" />
            </mat-card>
            </a>
        </mat-grid-tile>
    </mat-grid-list>
</div>

<mat-form-field appearance="fill">
    <mat-label>Page</mat-label>
    <mat-select [(value)]="currentPage" (selectionChange)="loadCharacters()">
        <mat-option *ngFor="let page of pages" [value]="page">
            {{ page }}
        </mat-option>
    </mat-select>
</mat-form-field>
